```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Interactive comments section</title>

  <script type="module" src="app.js"></script>
</head>

<body>
  <main class="app">
    <h1 class="visually-hidden">Comments</h1>

    <ul class="thread" id="comments"></ul>

    <div id="new-comment"></div>
  </main>

  <dialog class="dialog" id="delete-dialog" aria-labelledby="dialog-title">
    <form id="delete-form">
      <h2 class="dialog__title" id="dialog-title">Delete comment</h2>

      <p>
        Are you sure you want to delete this comment? This will remove the
        comment and can’t be undone.
      </p>

      <div class="dialog__actions">
        <button
          type="submit"
          class="btn btn--neutral"
          value="cancel"
        >
          No, cancel
        </button>

        <button
          type="submit"
          class="btn btn--danger"
          value="delete"
        >
          Yes, delete
        </button>
      </div>
    </form>
  </dialog>

  <template id="t-comment">
    <li class="comment">
      <article class="card surface">

        <header class="card__head">
          <picture class="avatar">
            <source type="image/webp">
            <img
              src="./images/avatars/image-amyrobson.webp"
              alt=""
              width="32"
              height="32"
            >
          </picture>

          <strong class="card__name"></strong>

          <span class="badge">you</span>

          <time class="card__time"></time>
        </header>

        <div class="card__body">
          <p class="card__text"></p>
        </div>

        <div class="votes" role="group" aria-label="Score">
          <button
            type="button"
            class="votes__btn"
            data-act="up"
            aria-label="Upvote"
            aria-pressed="false"
          >
            <span
              class="icon icon--plus"
              aria-hidden="true"
            ></span>
          </button>

          <output class="votes__score"></output>

          <button
            type="button"
            class="votes__btn"
            data-act="down"
            aria-label="Downvote"
            aria-pressed="false"
          >
            <span
              class="icon icon--minus"
              aria-hidden="true"
            ></span>
          </button>
        </div>

        <div class="card__actions">
          <button
            type="button"
            class="action"
            data-act="reply"
          >
            <span
              class="icon icon--reply"
              aria-hidden="true"
            ></span>
            Reply
          </button>

          <button
            type="button"
            class="action action--danger"
            data-act="delete"
          >
            <span
              class="icon icon--delete"
              aria-hidden="true"
            ></span>
            Delete
          </button>

          <button
            type="button"
            class="action"
            data-act="edit"
          >
            <span
              class="icon icon--edit"
              aria-hidden="true"
            ></span>
            Edit
          </button>
        </div>

      </article>
    </li>
  </template>

  <template id="t-composer">
    <form class="composer" data-kind="comment">
      <div class="composer__inner surface">

        <picture class="avatar composer__avatar">
          <source type="image/webp">

          <img
            src="./images/avatars/image-juliusomo.webp"
            alt=""
            width="32"
            height="32"
          >
        </picture>

        <textarea
          class="textarea composer__text"
          rows="3"
          placeholder="Add a comment…"
          aria-label="Your comment"
        ></textarea>

        <button
          class="btn composer__btn"
          type="submit"
        >
          Send
        </button>

      </div>
    </form>
  </template>

  <template id="t-edit">
    <form class="edit" data-kind="edit">
      <textarea
        class="textarea"
        rows="3"
        aria-label="Edit your comment"
      ></textarea>

      <button
        class="btn"
        type="submit"
      >
        Update
      </button>
    </form>
  </template>

</body>
</html>
```
